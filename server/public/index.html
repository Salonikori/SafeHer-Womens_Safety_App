<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF8FC0">
<title>SafeHer: Women's Safety</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="/msgcheck.js"></script>
<script id="early">try{if(JSON.parse(localStorage.getItem("fs_disguise")).on)document.documentElement.classList.add("disg")}catch(e){}</script>
<style>
/* ===== SafeHer design system ===== */
:root{--bg:#FFF2F7;--ink:#4A2140;--mute:#8D6682;--line:#FAD3E3;--gline:rgba(224,53,127,.38);--pur:#D42B78;--pur2:#FF7DB5;--teal:#0FA38A;--hi:#E11D52;--md:#C2740A;--lo:#0FA38A;--panel:#4A2140;--panelt:#FFF2F7;--surf:#fff;--glass:rgba(255,242,247,.66);--b1:#E0357F;--b2:#F763A5;--shadow:0 1px 2px rgba(224,53,127,.07),0 12px 28px -12px rgba(224,53,127,.28);--shadow2:0 2px 6px rgba(224,53,127,.08),0 26px 50px -16px rgba(224,53,127,.38);--tint:rgba(240,80,154,.1)}
@media(prefers-color-scheme:dark){:root{--bg:#22101D;--ink:#FFE9F2;--mute:#D8AAC4;--line:#4D2A43;--gline:rgba(255,143,190,.45);--pur:#FF9CC6;--pur2:#FFB8D8;--teal:#5EE0C8;--hi:#FF7A9E;--md:#F5B454;--lo:#5EE0C8;--panel:#170B14;--panelt:#FFE9F2;--surf:#2F1829;--glass:rgba(34,16,29,.68);--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);--shadow2:0 2px 6px rgba(0,0,0,.35),0 26px 52px -18px rgba(0,0,0,.7);--tint:rgba(255,156,198,.13)}}
*{box-sizing:border-box}html{scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Nunito",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(620px 440px at 90% -6%,rgba(255,134,184,.34),transparent 70%),radial-gradient(560px 440px at -6% 6%,rgba(196,170,255,.28),transparent 70%),radial-gradient(560px 520px at 55% 112%,rgba(255,196,160,.30),transparent 70%)}
h1,h2,h3{font-family:"Fredoka",system-ui,sans-serif;line-height:1.1;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.2rem,7vw,3.7rem);font-weight:700}h2{font-size:1.7rem;font-weight:600}h3{font-size:1.15rem;font-weight:600}
a{color:var(--pur);text-underline-offset:3px}
p{margin:.6em 0}

/* header + sticky nav */
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 8px;max-width:960px;margin:auto}
.brand{display:inline-flex;align-items:center;gap:10px;font:700 1.45rem "Fredoka",sans-serif;letter-spacing:-.02em}
.logo{width:36px;height:36px;flex:none;filter:drop-shadow(0 6px 10px rgba(224,53,127,.35))}
.stick{position:sticky;top:0;z-index:30;-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);background:var(--glass);border-bottom:1px solid transparent}
.navw{max-width:960px;margin:auto;padding:6px 20px 8px}
#nav{margin:0}
select,input{font:inherit;color:var(--ink);background:var(--surf);border:2px solid color-mix(in srgb,var(--mute) 30%,var(--line));border-radius:16px;padding:11px 14px;transition:border-color .15s,box-shadow .15s}
select{border-radius:99px;padding:8px 14px;font-size:.95rem;font-weight:600;cursor:pointer}
input{width:100%}label{display:block;font-weight:600;margin:16px 0 5px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pur);box-shadow:0 0 0 4px var(--tint)}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.7}
input[type=checkbox],input[type=radio]{accent-color:var(--b1)}
main{max-width:960px;margin:auto;padding:22px 20px 110px}

/* buttons */
button{font:800 1rem "Nunito",sans-serif;cursor:pointer;border-radius:99px;border:1.5px solid transparent;background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;padding:12px 24px;min-height:48px;border-radius:99px;box-shadow:0 4px 0 #B8236A,0 12px 20px -8px rgba(224,53,127,.6);transition:transform .12s,filter .15s,box-shadow .12s}
button:hover{filter:brightness(1.06);transform:translateY(-1px)}button:active{transform:translateY(3px);box-shadow:0 1px 0 #B8236A,0 4px 8px -4px rgba(224,53,127,.5)}
button.ghost{background:transparent;color:var(--pur);border-color:var(--gline);box-shadow:none}
button.ghost:hover{background:var(--tint);filter:none;transform:none}button.ghost:active{transform:scale(.97);box-shadow:none}
button.sm{padding:6px 16px;min-height:38px;font-size:.92rem;border-radius:99px;box-shadow:0 3px 0 #B8236A,0 8px 14px -8px rgba(224,53,127,.5)}button.ghost.sm{box-shadow:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
a>button{text-decoration:none}
.call{background:linear-gradient(135deg,#FF5C86,#E11D52);box-shadow:0 4px 0 #A8123B,0 12px 20px -8px rgba(225,29,82,.6)}

.lead{font-size:1.2rem;color:var(--mute);max-width:36em}
.trust{display:inline-flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--teal) 45%,transparent);background:color-mix(in srgb,var(--teal) 10%,transparent);color:var(--teal);border-radius:99px;padding:5px 14px;font-size:.9rem;font-weight:600;margin-bottom:18px}
.trust::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 25%,transparent)}
.box{background:var(--surf);border:2px solid var(--line);border-radius:26px;padding:24px;margin:18px 0;box-shadow:var(--shadow)}
.box h3{display:flex;align-items:center;gap:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden;margin:18px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b1),var(--pur2));border-radius:9px;transition:width .4s}

/* score card */
.dossier{position:relative;overflow:hidden;background:linear-gradient(150deg,#FF8FC0 0%,#F0509A 55%,#C93C9E 100%);color:#fff;border:2px solid rgba(255,255,255,.55);border-radius:32px;padding:26px;margin:18px 0;box-shadow:0 8px 0 #C4286E,var(--shadow2)}
.dossier::before{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.45),transparent 70%);pointer-events:none}
.dossier::after{content:"\2726  \2665  \2726";position:absolute;right:20px;bottom:10px;font-size:1.1rem;letter-spacing:.5em;opacity:.55;pointer-events:none}
.dossier>*{position:relative}
.dossier h2{color:#fff}.dossier .big{font:700 4.8rem/1 "Fredoka",sans-serif;color:#fff;-webkit-text-fill-color:#fff;text-shadow:0 4px 0 rgba(160,20,90,.35)}
.dossier li{margin:.3em 0}.dossier .gone{text-decoration:line-through;opacity:.45}

/* tabs / pills */
.tabs{display:flex;gap:4px;padding:5px;background:var(--surf);border:2px solid var(--line);border-radius:99px;margin:22px 0 12px;overflow-x:auto;scrollbar-width:none;box-shadow:var(--shadow)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;color:var(--mute);border:0;border-radius:99px;box-shadow:none;transform:none;white-space:nowrap;padding:9px 18px;min-height:42px;font-weight:700}
.tabs button:hover{background:var(--tint);color:var(--ink);filter:none;transform:none}.tabs button:active{transform:none;box-shadow:none}
.tabs button[aria-selected=true],.tabs button[aria-current=page]{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;box-shadow:0 3px 0 #B8236A,0 8px 14px -8px rgba(224,53,127,.7)}

/* findings */
.f{position:relative;overflow:hidden;background:var(--surf);border:2px solid var(--line);border-radius:22px;padding:18px 20px 16px 26px;margin:14px 0;box-shadow:var(--shadow);--tagbg:rgba(15,163,138,.14)}
.f::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--lo)}
.f.s3{--tagbg:rgba(225,29,82,.12)}.f.s3::before{background:var(--hi)}.f.s2{--tagbg:rgba(194,122,10,.14)}.f.s2::before{background:var(--md)}.f.done{opacity:.6}
.tag{display:inline-block;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 11px;border-radius:99px;background:var(--tagbg);margin-bottom:8px}
.s3 .tag{color:var(--hi)}.s2 .tag{color:var(--md)}.s1 .tag{color:var(--lo)}
.f ol{padding-left:20px;margin:8px 0}.f details{margin-top:10px;background:var(--tint);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:700;color:var(--pur)}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font:.92rem/1.5 "Nunito",sans-serif}
.hot{outline:2px solid var(--hi)}
.hide{display:none}.note{color:var(--mute);font-size:.93rem}
input[type=file]{padding:10px}
textarea{width:100%;min-height:140px;font:inherit;color:var(--ink);background:var(--surf);border:2px solid color-mix(in srgb,var(--mute) 30%,var(--line));border-radius:18px;padding:12px 16px;transition:border-color .15s,box-shadow .15s}

/* SOS */
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,#FF5C86,#E11D52);color:#fff;border:0;border-radius:99px;min-width:68px;min-height:58px;font:700 1.05rem "Fredoka",sans-serif;letter-spacing:.04em;box-shadow:0 12px 28px -6px rgba(214,36,90,.7),0 0 0 0 rgba(214,36,90,.5);z-index:5;animation:fabp 2.6s ease-out infinite}
@keyframes fabp{0%{box-shadow:0 12px 28px -6px rgba(214,36,90,.7),0 0 0 0 rgba(214,36,90,.45)}70%,100%{box-shadow:0 12px 28px -6px rgba(214,36,90,.7),0 0 0 18px rgba(214,36,90,0)}}
.sosb{width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 32% 24%,#FF9DB8,#FF4B7E 48%,#D01848);border:0;color:#fff;font:700 2.9rem "Fredoka",sans-serif;letter-spacing:.04em;display:block;margin:48px auto;box-shadow:0 22px 44px -12px rgba(214,36,90,.7),inset 0 -8px 18px rgba(0,0,0,.18),0 0 0 12px rgba(214,36,90,.14),0 0 0 26px rgba(214,36,90,.07);animation:sosp 2.4s ease-in-out infinite}
#cd{font-weight:600;font-size:1.1rem;margin:-18px 0 22px}#cd button{margin-top:12px}
.sosb:hover{filter:brightness(1.06)}.sosb:active{transform:scale(.96)}
@keyframes sosp{50%{box-shadow:0 22px 44px -12px rgba(214,36,90,.7),inset 0 -8px 18px rgba(0,0,0,.18),0 0 0 18px rgba(214,36,90,.1),0 0 0 38px rgba(214,36,90,.04)}}

.chip{display:inline-block;border-radius:99px;padding:3px 12px;font-weight:700;font-size:.88rem;border:1.5px solid}
.hl{white-space:pre-wrap;word-break:break-word;background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.75}
mark.mk{color:inherit;border-radius:4px;padding:1px 2px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}mark.mk3{background:rgba(201,37,79,.22);text-decoration-color:var(--hi)}mark.mk2{background:rgba(194,122,10,.25);text-decoration-color:var(--md)}mark.mk sup{font-size:.65em;font-weight:700;margin-left:2px}
ol.why li{margin:.6em 0}.fb{border-top:1px solid var(--line);margin-top:14px}.thumb{max-width:100%;max-height:260px;border-radius:14px;display:block;margin:12px 0}
.bar.ind i{width:30%;animation:ind 1.2s linear infinite;transition:none}@keyframes ind{from{margin-left:-30%}to{margin-left:100%}}
.callout{border-left:5px solid var(--md);background:color-mix(in srgb,var(--md) 10%,var(--surf));padding:4px 14px;border-radius:0 12px 12px 0;margin:10px 0}
.s-ok{color:var(--lo)}.s-bad{color:var(--hi)}.s-mid{color:var(--md)}
.st{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line)}.st:last-child{border-bottom:0}.st>span:first-child{font-weight:700}.al{margin:10px 0}

/* sharing bar */
#shbar{background:linear-gradient(90deg,#D81B52,#FF4B7E);color:#fff;padding:9px 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;font-weight:600}#shbar.hide{display:none}#shbar.sh{background:linear-gradient(90deg,#0B6F64,#0B8F80)}#shbar.off{background:#8D5A7F}
#shbar .dot{width:12px;height:12px;border-radius:50%;background:#fff;animation:pl 1.2s ease-in-out infinite;flex:none}#shbar.off .dot{animation:none;opacity:.6}@keyframes pl{50%{opacity:.25}}
#shbar button{background:#fff;color:#4A2140;border-color:#fff;min-height:36px;padding:4px 14px;font-size:.9rem;box-shadow:none}#shbar button.g{background:transparent;color:#fff}

/* modal */
.mdl{position:fixed;inset:0;background:rgba(74,33,64,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.mbox{background:var(--surf);color:var(--ink);border:2px solid var(--line);border-radius:30px;padding:26px;max-width:520px;width:100%;max-height:100%;overflow:auto;box-shadow:var(--shadow2)}.mbox li{margin:.35em 0}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:16px 0}.chk input{width:22px;height:22px;flex:none;margin-top:2px}
.ev{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.ev .thumb{max-height:110px;margin:0;border:1px solid var(--line)}

/* landing */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:center;padding:8px 0 6px;animation:up .6s both}
.hero h1{background:linear-gradient(120deg,var(--ink) 30%,var(--pur) 70%,#FF8A5C 120%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-bottom:.06em}
.hero .row{margin-top:24px}.hero button{padding:14px 26px;font-size:1.05rem}
.hero-art{width:100%;max-width:330px;justify-self:center}.hero-art svg{width:100%;height:auto;display:block;overflow:visible}
.ring{fill:none;stroke:var(--pur);stroke-width:1.5;transform-origin:160px 160px;animation:rg 3.6s ease-out infinite;opacity:0}.ring.r2{animation-delay:1.2s}.ring.r3{animation-delay:2.4s}
@keyframes rg{0%{transform:scale(.45);opacity:.55}100%{transform:scale(1.15);opacity:0}}
.sp{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}.sp.b{animation-delay:.8s}.sp.c{animation-delay:1.5s}
@keyframes tw{0%,100%{transform:scale(.55) rotate(0);opacity:.55}50%{transform:scale(1.1) rotate(20deg);opacity:1}}
.flt{animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.ringf{fill:none;stroke:var(--pur);stroke-opacity:.18;stroke-width:1.5}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:30px 0 8px}
button.feat{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surf);color:var(--ink);border:2px solid var(--line);border-radius:28px;padding:22px;min-height:0;box-shadow:0 5px 0 var(--line),var(--shadow);animation:up .6s both}
button.feat:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 9px 0 var(--line),var(--shadow2);border-color:var(--gline);filter:none}button.feat:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
button.feat:nth-child(2){animation-delay:.06s}button.feat:nth-child(3){animation-delay:.12s}button.feat:nth-child(4){animation-delay:.18s}button.feat:nth-child(5){animation-delay:.24s}
.ico{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,134,184,.32),rgba(255,196,160,.22));color:var(--pur);margin-bottom:6px}
.ico svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feat.sosf .ico{background:rgba(225,29,82,.14);color:var(--hi)}
.ft{font:700 1.15rem "Fredoka",sans-serif;letter-spacing:-.01em}.fd{font:400 .96rem/1.5 "Nunito",sans-serif;color:var(--mute)}
.sec{font-size:1.6rem;margin:42px 0 4px}.sec::after{content:" \2726";color:#FF8FC0;font-size:.8em}
@media(min-width:600px){button.feat.sosf{grid-column:span 2}}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:14px 0}
.stp{background:var(--surf);border:2px dashed var(--gline);border-radius:26px;padding:20px;box-shadow:var(--shadow)}
.stp i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;font:700 1rem "Fredoka",sans-serif;font-style:normal;margin-bottom:10px}
.stp b{display:block;font:700 1.1rem "Fredoka",sans-serif;margin-bottom:4px}.stp span{display:block;color:var(--mute);font-size:.96rem;line-height:1.5}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surf);border:2px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:600;font-size:.93rem;box-shadow:var(--shadow)}
.pill svg{width:17px;height:17px;fill:none;stroke:var(--teal);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.emg{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,rgba(255,134,184,.2),rgba(255,196,160,.18));border:2px solid rgba(225,29,82,.22);border-radius:28px;padding:18px 22px;margin:26px 0 6px}
.emg b{font:700 1.1rem "Fredoka",sans-serif}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* disguise (calculator) */
html.disg body>:not(#calc){display:none!important}html.disg body::before{display:none}#calc{display:none}html.disg #calc{display:flex}html.disg body{background:#000}
#calc{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:100;background:#000;color:#fff;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#cdisp{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;font-size:56px;padding:24px;word-break:break-all}#ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}#ckeys button{height:72px;border:0;border-radius:36px;background:#333;color:#fff;font-size:26px;padding:0;box-shadow:none}#ckeys button.op{background:#F2B84B;color:#1B1424}

@media(max-width:720px){.hero{grid-template-columns:1fr;padding-top:10px}.hero-art{max-width:170px;order:-1;justify-self:start}.dossier .big{font-size:3.8rem}.sosb{width:190px;height:190px}h2{font-size:1.45rem}main{padding-bottom:120px}}
@media print{header,.stick,.tabs,button,select,.noprint,#shbar,#fab,body::before{display:none!important}body{background:#fff;color:#000}.dossier{background:#eee;color:#000;box-shadow:none}.dossier .big{color:#000;-webkit-text-fill-color:#000}.tabpane{display:block!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="calc" role="group" aria-label="Calculator"><div id="cdisp" role="status">0</div><div id="ckeys"></div></div>
<header><span class="brand"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0509A"/><stop offset="1" stop-color="#FF9BC9"/></linearGradient></defs><path d="M24 3 6 10v13c0 11 7.6 18.4 18 22 10.4-3.600 18-11 18-22V10z" fill="url(#lg)"/><path transform="translate(12 12.4)" d="M12 20.5s-7-4.3-9.2-8.8A5 5 0 0 1 12 6.8a5 5 0 0 1 9.2 4.9C19 16.2 12 20.5 12 20.5z" fill="#fff"/></svg>SafeHer</span>
<span class="row" style="gap:8px"><button class="ghost sm hide" id="hideb">Hide app</button><button class="ghost sm" id="ha"></button><select id="lang" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option></select></span></header>
<div class="stick noprint"><div id="shbar" class="noprint hide" role="status" aria-live="polite"></div>
<div class="navw"><nav id="nav" class="tabs" aria-label="Sections"></nav></div></div>
<main id="app"></main>
<button id="fab" aria-label="Open SOS">SOS</button>
<script>

 const v=expr();if(i!==s.length||!isFinite(v))throw 0;return v}

 const r=await api("/sos/"+sos.id+"/loc","POST",f?{lat:f.lat,lon:f.lon,acc:f.acc}:{});st.pushing=false;
 if(r.ok){st.lastOk=Date.now();st.fail=0;st.err="";st.views=r.j.views||0;st.lastView=r.j.last_view_at||null;if(r.j.expires_at)sos.expires_at=r.j.expires_at}
 else{st.fail++;if(r.status===404){endedLocal("Sharing has ended on the server: it expired or was stopped. Your location is no longer shared and the link no longer works.");return}else if(r.status===401)st.err="signedout"}
 paint()}
async function stopSos(flash){if(watch!=null)navigator.geolocation.clearWatch(watch);watch=null;clearInterval(st.hb);clearInterval(uiT);if(sos)await api("/sos/"+sos.id+"/end","POST");sos=null;st=newSt();paintBar();if(flash)flashBar("Sharing stopped. The link no longer works and stored location points were deleted.")}
function endedLocal(msg){if(watch!=null)navigator.geolocation.clearWatch(watch);watch=null;clearInterval(st.hb);clearInterval(uiT);sos=null;st=newSt();endNote=msg;paintBar();flashBar(msg);if(view==="sos")render()}
function recoverSos(){if(!user||sos)return;return api("/sos/active").then(r=>{if(r.ok&&r.j.sos&&!sos){sos=r.j.sos;st=newSt();st.views=sos.views||0;st.lastView=sos.last_view_at||null;st.lastOk=Date.now();trackWatch();paintBar();if(view==="sos")render()}})}
function paint(){const el=$("#sr");if(!el||!sos)return;const f=st.fix,q=f?qual(f.acc):null;let net,loc,seen;
 if(st.err==="signedout")net='<span class="s-bad">You were signed out, so updates stopped. Sign in again.</span>';
 else if(st.fail>0)net=`<span class="s-bad">Not reaching the server (${st.fail} failed ${st.fail>1?"tries":"try"}). Retrying every 10 seconds. Last success ${st.lastOk?ago(st.lastOk):"never"}.</span>`;
 else net=st.lastOk?`<span class="s-ok">Live link working. Last update sent ${ago(st.lastOk)}.</span>`:'<span class="s-mid">Checking the connection...</span>';
 if(f)loc=`<span class="${q[1]}">About ${Math.round(f.acc)} m (${q[0]})</span> <span class="note">GPS reading ${ago(f.at)}</span>${f.acc>100?'<br><span class="s-bad">Weak fix. Move outdoors or turn on GPS and high accuracy for a better position.</span>':""}`;
 else loc=`<span class="${st.geoErr==="denied"||st.geoErr==="unavailable"?"s-bad":"s-mid"}">${esc(st.geoErr?GEOMSG[st.geoErr]:"Still looking for your location...")}</span>`;
 const lv=st.lastView?Date.parse(st.lastView):0;
 seen=st.views?`<span class="s-ok">Opened ${st.views} time${st.views>1?"s":""}. ${lv&&Date.now()-lv<30000?"Someone is watching now.":"Last seen "+ago(lv)+"."}</span>`:'<span class="s-mid">Not opened yet. Send it to your contacts below.</span>';
 const ex=sos.expires_at?Date.parse(sos.expires_at):0,xl=ex?ex-Date.now():0,exr=ex?`<div class="st"><span>Link expires</span><span class="${xl<5*6e4?"s-mid":""}">in ${clock(xl)} (at ${new Date(ex).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})})</span></div>`:"";const xa=$("#exa");xa&&ex&&(xa.textContent="at "+new Date(ex).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+" (in "+clock(xl)+")");
 el.innerHTML=`<div class="st"><span>Server link</span><span>${net}</span></div>${exr}<div class="st"><span>Location accuracy</span><span>${loc}</span></div><div class="st"><span>Tracking link seen</span><span>${seen}</span></div>`;
 const key=(st.fail>0||st.err)?"bad":"ok",sa=$("#sa");
 if(sa&&sa.dataset.k!==key){sa.dataset.k=key;
  sa.innerHTML=key==="bad"?'<div class="row" style="margin-top:10px" role="alert"><button class="sm" id="rt">Retry now</button><button class="ghost sm" id="smsb">Send my location by SMS instead</button></div><p class="note">The SMS button only opens your SMS app with the message ready. You must press Send yourself.</p>':"";
  const rt=$("#rt");rt&&(rt.onclick=()=>pushLoc());const sb=$("#smsb");sb&&(sb.onclick=()=>{location.href=smsPack(st.fix).href})}}
function alState(){const a=LS.get("fs_alerts");return a&&sos&&a.id===sos.id?a.c:{}}
function setAl(cid,state,app){const c=alState(),o=c[cid]||{};c[cid]={state,app:app||o.app||"",at:Date.now()};LS.set("fs_alerts",{id:sos.id,c});paintAlerts()}
function paintAlerts(){const el=$("#alerts");if(!el)return;const s=alState(),n=CS.length,m=encodeURIComponent(alertText()),done=CS.filter(c=>s[c.id]&&s[c.id].state==="sent").length;
 el.innerHTML=(n?`<p class="note">${done} of ${n} contacts confirmed by you as sent.</p>`:'<p class="note">No saved contacts. Add them under Contacts, or use Share link.</p>')+CS.map(c=>{const x=s[c.id]||{};
  const status=x.state==="sent"?`<span class="s-ok">You confirmed it was sent at ${new Date(x.at).toLocaleTimeString()}</span>`:x.state==="opened"?`<span class="s-mid">${esc(x.app)} opened at ${new Date(x.at).toLocaleTimeString()}. Not sent until you press Send there.</span>`:'<span class="s-bad">Not sent yet</span>';
  return `<div class="al"><div class="st"><span>${esc(c.name)}</span><span>${status}</span></div><div class="row"><a data-o="${esc(c.id)}" data-app="WhatsApp" href="https://wa.me/${esc(c.phone.replace("+",""))}?text=${m}" target="_blank" rel="noopener"><button class="sm">WhatsApp</button></a><a data-o="${esc(c.id)}" data-app="SMS" href="sms:${esc(c.phone)}?body=${m}"><button class="ghost sm">SMS</button></a>${x.state==="opened"?`<button class="sm" data-sent="${esc(c.id)}">I pressed Send</button>`:""}</div></div>`}).join("");
 el.querySelectorAll("a[data-o]").forEach(a=>a.addEventListener("click",()=>setTimeout(()=>setAl(a.dataset.o,"opened",a.dataset.app),0)));
 el.querySelectorAll("[data-sent]").forEach(b=>b.onclick=()=>setAl(b.dataset.sent,"sent"))}
/* ---------- Live sharing: consent dialog, always-visible indicator, automatic expiry ---------- */
let endNote="",flashUntil=0;
const clock=ms=>{ms=Math.max(0,Math.round(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return(h?h+":"+pad2(m):m)+":"+pad2(s)};
const DURS=[[30,"30 minutes"],[60,"1 hour"],[120,"2 hours"],[240,"4 hours"],[480,"8 hours"],[720,"12 hours"]];
function askShareConsent(){return new Promise(res=>{const prev=document.activeElement,last=LS.get("fs_dur")||120,o=document.createElement("div");o.className="mdl";
 o.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mdt"><h3 id="mdt">Create a public tracking link?</h3><p>Please read before you start:</p><ul>
 <li>Anyone who gets the link can see your live location and your name. They do not need to sign in.</li>
 <li>The app does not send the link for you. You choose who to share it with.</li>
 <li>Sharing stops by itself at the time you choose below. You can stop it earlier at any moment. Then the link stops working and the stored location points are deleted.</li>
 <li>While sharing, a bar at the top of the app shows that you are being tracked. Your phone needs location turned on and this page open to keep updating.</li></ul>
 <label for="mdur">Stop sharing automatically after</label><select id="mdur">${DURS.map(([m,l])=>`<option value="${m}" ${m===last?"selected":""}>${l}</option>`).join("")}</select>
 <label class="chk"><input type="checkbox" id="mok"><span>I understand that anyone with the link can see where I am, and I want to create it.</span></label>
 <div class="row"><button id="myes" disabled>Create link and start sharing</button><button class="ghost" id="mno">Cancel</button></div></div>`;
 document.body.appendChild(o);const ok=o.querySelector("#mok"),yes=o.querySelector("#myes"),no=o.querySelector("#mno");
 const done=v=>{document.removeEventListener("keydown",kd,true);o.remove();prev&&prev.focus&&prev.focus();res(v)};
 const kd=e=>{if(e.key==="Escape"){e.stopPropagation();e.preventDefault();done(null)}
  else if(e.key==="Tab"){const f=[...o.querySelectorAll("select,input,button:not([disabled])")];if(!f.length)return;const i=f.indexOf(document.activeElement);
   if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i===f.length-1||i<0)){e.preventDefault();f[0].focus()}}};
 document.addEventListener("keydown",kd,true);ok.onchange=()=>{yes.disabled=!ok.checked};
 yes.onclick=()=>ok.checked&&done({minutes:Number(o.querySelector("#mdur").value)});no.onclick=()=>done(null);o.addEventListener("click",e=>{if(e.target===o)done(null)});
 o.querySelector("#mdur").focus()})}
function flashBar(msg){const b=$("#shbar");if(!b||sos)return;flashUntil=Date.now()+8000;b.className="off noprint";b.innerHTML=`<span class="dot"></span><span>${esc(msg)}</span>`}
function paintBar(force){const b=$("#shbar");if(!b)return;
 if(!sos){if(Date.now()<flashUntil)return;b.className="hide noprint";b.innerHTML="";b.dataset.k="";return}
 const exp=sos.expires_at?Date.parse(sos.expires_at):0,left=exp-Date.now();
 if(exp&&left<=0){const id=sos.id;api("/sos/"+id+"/end","POST");endedLocal("Sharing ended automatically at "+new Date(exp).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+". Your location is no longer shared and the link has stopped working.");return}
 const k=sos.id+sos.kind;flashUntil=0;
 if(b.dataset.k!==k||force){b.dataset.k=k;const isSos=sos.kind==="sos";b.className=(isSos?"":"sh")+" noprint";
  b.innerHTML=`<span class="dot"></span><span id="shl"></span><span class="row" style="gap:8px"><button id="shm">${view==="sos"?"Sharing controls":"Manage"}</button><button class="g" id="shs">Stop sharing</button></span>`;
  $("#shm").onclick=()=>{view="sos";render();scrollTo(0,0)};
  $("#shs").onclick=async()=>{if(sos&&sos.kind==="sos"&&!confirm("Stop the SOS? Your contacts will no longer see your location."))return;await stopSos(true);if(view==="sos")render()}}
 const t=$("#shl");if(t){t.textContent=(sos.kind==="sos"?"SOS is on. Your live location is being shared.":"Your live location is being shared.")+(exp?" Ends in "+clock(left)+".":"")+(st.fail>0?" Not reaching the server.":"")}}
setInterval(paintBar,1000);
$("#lang").onchange=e=>{L=e.target.value;document.documentElement.lang=L;view==="scan"?0:render()};
render();
</script>
