<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#FF8FC0"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><title>Live location</title>
<style>
:root{--bg:#FFF2F7;--ink:#4A2140;--mute:#8D6682;--line:#FAD3E3;--surf:#fff;--hi:#E11D52;--ok:#0FA38A}
@media(prefers-color-scheme:dark){:root{--bg:#22101D;--ink:#FFE9F2;--mute:#D8AAC4;--line:#4D2A43;--surf:#2F1829;--hi:#FF7A9E;--ok:#5EE0C8}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:18px/1.55 "Nunito",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:max(20px,env(safe-area-inset-top)) 18px 32px;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 420px at 90% -5%,rgba(255,134,184,.34),transparent 70%),radial-gradient(520px 420px at -5% 105%,rgba(255,196,160,.3),transparent 70%)}
.wrap{max-width:560px;margin:0 auto}
.br{display:flex;align-items:center;gap:10px;font:700 1.3rem "Fredoka",system-ui,sans-serif;letter-spacing:-.02em;margin:6px 0 20px}.br svg{width:34px;height:34px}.br small{font:600 .85rem "Nunito",sans-serif;color:var(--mute);margin-left:auto;letter-spacing:0}
.card{background:var(--surf);border:1px solid var(--line);border-radius:32px;padding:26px 24px;border-width:2px;box-shadow:0 7px 0 var(--line),0 28px 56px -20px rgba(224,53,127,.4)}
h1{font:700 clamp(1.8rem,7vw,2.4rem)/1.1 "Fredoka",system-ui,sans-serif;letter-spacing:-.02em;margin:.55em 0 .3em}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--mute);border-radius:99px;padding:3px 14px;font-weight:800;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.on{color:var(--hi);background:rgba(214,36,90,.1)}.on::before{animation:pl 1.1s ease-in-out infinite}.off{color:var(--ok);background:rgba(11,143,128,.1)}
@keyframes pl{50%{opacity:.2;transform:scale(.7)}}
#p{color:var(--mute);margin:.3em 0 0}
.b{display:flex;align-items:center;justify-content:center;margin-top:20px;background:linear-gradient(135deg,#E0357F,#F763A5);color:#fff;padding:16px 20px;border-radius:99px;text-decoration:none;font-weight:800;box-shadow:0 4px 0 #B8236A,0 12px 24px -10px rgba(224,53,127,.6);word-break:break-word;text-align:center}
.b:active{transform:scale(.98)}
.sos{display:none;margin-top:18px;gap:10px}.sos a{flex:1;text-align:center;padding:13px;border-radius:99px;text-decoration:none;font-weight:800;background:linear-gradient(135deg,#FF5C86,#E11D52);color:#fff}.sos a+a{background:transparent;color:var(--hi);border:1.5px solid var(--hi)}
.n{opacity:.8;color:var(--mute);font-size:.95rem;text-align:center;margin-top:18px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body><div class="wrap"><div class="br"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0509A"/><stop offset="1" stop-color="#FF9BC9"/></linearGradient></defs><path d="M24 3 6 10v13c0 11 7.6 18.4 18 22 10.4-3.6 18-11 18-22V10z" fill="url(#lg)"/><path transform="translate(12 12.4)" d="M12 20.5s-7-4.3-9.2-8.8A5 5 0 0 1 12 6.8a5 5 0 0 1 9.2 4.9C19 16.2 12 20.5 12 20.5z" fill="#fff"/></svg>SafeHer<small>Live location</small></div><div class="card"><span id="c" class="chip">Loading</span><h1 id="h">Checking link...</h1><p id="p"></p><div id="m"></div><div class="sos" id="sosrow"><a href="tel:112">Call 112</a><a href="tel:181">Call 181</a></div></div><p class="n">This page updates by itself. If this person needs help, call 112.</p></div>
<script>
const tk=new URLSearchParams(location.search).get("t")||"",$=i=>document.getElementById(i);
const ago=s=>{s=Math.max(0,Math.round((Date.now()-Date.parse(s))/1000));return s<60?s+" seconds ago":Math.round(s/60)+" minutes ago"};
let first=true;
async function poll(){try{const r=await fetch("/api/track/"+encodeURIComponent(tk)+(first?"?open=1":""),{cache:"no-store"});first=false;const j=await r.json();$("m").textContent="";
 if(!r.ok){$("c").textContent="Unavailable";$("h").textContent=j.error||"Link not found";$("p").textContent="";return}
 const who=j.name||"Someone",sos=j.kind==="sos";$("c").textContent=j.active?(sos?"EMERGENCY":"Live"):"Ended";$("c").className="chip "+(j.active&&sos?"on":"off");
 $("h").textContent=j.active?who+(sos?" needs help":" is sharing their location"):who+" stopped sharing";$("sosrow").style.display=j.active&&sos?"flex":"none";
 if(!j.active){$("p").textContent="Sharing has ended. They stopped sharing, or the time they set ran out. This link no longer shows any location.";return}
 if(!j.loc){$("p").textContent="Waiting for the first location update..."+(j.expires_at?" Sharing stops automatically at "+new Date(j.expires_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+".":"");return}
 const until=j.expires_at?new Date(j.expires_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";const l=j.loc,age=(Date.now()-Date.parse(l.ts))/1000,q=l.acc?(l.acc<=30?"good":l.acc<=100?"fair":"poor"):"";$("p").textContent="Last update "+ago(l.ts)+(l.acc?". Location accuracy about "+l.acc+" m ("+q+")":"")+(until?". Sharing stops automatically at "+until:"")+(age>60?". No update for over a minute: their phone may be offline or have a weak signal. If you are worried, call them or 112.":"");
 const a=document.createElement("a");a.className="b";a.target="_blank";a.rel="noopener";a.href="https://www.google.com/maps?q="+l.lat+","+l.lon;a.textContent="Open in Maps ("+l.lat.toFixed(5)+", "+l.lon.toFixed(5)+")";$("m").appendChild(a)
}catch(e){$("p").textContent="Connection problem. Retrying..."}}
poll();setInterval(poll,8000);
</script></body></html>
